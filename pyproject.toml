[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpt-gen"
version = "0.6.4"
description = "A CLI Tool for AI-Powered Web Platform Test Generation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    {name = "Google LLC"}
]
keywords = ["web-platform-tests", "wpt", "ai", "llm", "testing", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Core LLM Integration
    "google-adk>=2.7.0,<3.0.0",
    "google-cloud-storage>=2.18.0,<4.0.0",
    "google-genai>=1.62.0,<3.0.0",
    "openai>=2.20.0,<4.0.0",
    "anthropic>=0.84.0,<3.0.0",
    "tiktoken>=0.12.0,<1.0.0",
    "litellm>=1.84.0,<2.0.0",

    # Context & Scraping
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=6.0.4,<7.0.0",
    "markdownify>=0.14.0,<2.0.0",

    # Prompt Templating
    "jinja2>=3.1.6,<4.0.0",

    # CLI Infrastructure
    "typer>=0.23.0,<1.0.0",
    "rich>=15.0.0,<16.0.0",
    "pyyaml>=6.0.3,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/GoogleChromeLabs/wpt-gen"
Repository = "https://github.com/GoogleChromeLabs/wpt-gen"
Issues = "https://github.com/GoogleChromeLabs/wpt-gen/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.15.0,<1.0.0",
    "mypy>=1.20.1,<3.0.0",
    "types-PyYAML>=6.0.12.20250915,<7.0.0",
    "build>=1.4.0,<2.0.0",
    "twine>=6.2.0,<8.0.0",
    "black>=24.1.0,<27.0.0",
    "pylint>=4.0.5,<5.0.0",
]

[project.scripts]
wpt-gen = "wptgen.main:app"

[tool.setuptools.packages.find]
include = ["wptgen*"]

[tool.setuptools.package-data]
wptgen = [
    "templates/*.jinja",
    "templates/*.xml",
    "templates/*.txt",
    "skills/**/*"
]

[tool.black]
target-version = ['py311']
line-length = 80

[tool.ruff]
target-version = "py311"
line-length = 80
indent-width = 4

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# Enable a wide set of rules for strict linting
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "PT",   # flake8-pytest-style
]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.isort]
known-first-party = ["wptgen"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "scripts"

[tool.pytest.ini_options]
addopts = "--cov=wptgen --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "ignore::UserWarning:google.adk.features._feature_decorator",
    "ignore:\\[EXPERIMENTAL\\] feature FeatureName\\.SKILL_TOOLSET is enabled:UserWarning",
    "ignore::FutureWarning:google.api_core.*",
]
